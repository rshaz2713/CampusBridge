<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}CampusBridge{% endblock %}</title>
</head>
<body>
    {% block content %}
    <h1>CampusBridge</h1>
    {% if user.is_authenticated %}
        <p>Logged in as {{ user.username }}</p>
        <ul>
            <li><a href="{% url 'logout' %}">Logout</a></li>
            <li><a href="{% url 'dashboard_home' %}">Dashboard</a></li>
        </ul>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
    {% endblock %}
</body>
</html>
