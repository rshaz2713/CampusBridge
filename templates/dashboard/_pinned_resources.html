{% load static %}

{% if pinned_resources %}
<div class="mt-4">
    <h4 class="mb-3">
        <i class="fas fa-thumbtack text-primary"></i> 
        Pinned Resources
    </h4>
    
    <div class="row">
        {% for pin in pinned_resources %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm text-center border-primary border-start border-3">
                <div class="card-body">
                    <h5 class="card-title">
                        <i class="fas fa-thumbtack text-warning"></i> 
                        {{ pin.title }}
                    </h5>
                    {% if pin.description %}
                    <p class="card-text">
                        {{ pin.description }}
                    </p>
                    {% endif %}
                    {% if pin.url != '#' %}
                    <a href="{{ pin.url }}" target="_blank" class="btn btn-primary mx-3 px-4">
                       Visit
                    </a>
                    {% endif %}
                    
                    <form method="post" action="{% url 'toggle_pin' pin.resource_id %}" class="mt-2 d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="fas fa-times"></i> Unpin
                        </button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
