{% extends "base.html" %}

{% block title %}Login | CampusBridge{% endblock %}

{% block content %}

<h1>CampusBridge Login</h1>

{% if form.errors %}
<p style="color:red;">Invalid username or password.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>

{% endblock %}
